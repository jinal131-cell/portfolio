function useInView(th=.15){

/* Hero particle network that reacts to the cursor */
function Particles(){
  const c=useRef();

    if(reduce)return;const cv=c.current,x=cv.getContext&&cv.getContext("2d");if(!x)return;

    const draw=()=>{x.clearRect(0,0,w,ht);

        if(Math.hypot(p.x-m.x,p.y-m.y)<150){p.x+=(p.x-m.x)*.012;p.y+=(p.y-m.y)*.012}

    return()=>{cancelAnimationFrame(id);removeEventListener("resize",size);removeEventListener("pointermove",mv)};
  },[]);
